# KRONOS Ecosystem - pnpm workspaces
# Creador: Marco Antonio Rojas Valdovinos (#000)
# Firma: DMD-33
#
# Define dónde viven los paquetes internos del monorepo.
# Cada carpeta en apps/ y packages/ es un paquete independiente.

packages:
  # Aplicaciones desplegables
  - "apps/*"

  # Librerías compartidas
  - "packages/*"

  # Excluir node_modules de cualquier subcarpeta
  - "!**/node_modules/**"

  # Excluir builds antiguos
  - "!**/dist/**"
  - "!**/.next/**"
  - "!**/build/**"
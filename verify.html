<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KRONOS VERIFY - 51/49</title>
<style>
body{font-family:monospace;background:#0a0a0a;color:#00ff88;padding:20px}
input{width:100%;padding:12px;background:#111;border:1px solid #00ff88;color:#00ff88;font-size:16px}
button{width:100%;padding:12px;background:#00ff88;color:#000;border:0;margin-top:10px;font-weight:bold;cursor:pointer}
#result{margin-top:20px;padding:15px;background:#111;border-left:3px solid #00ff88;white-space:pre-wrap}
.verificado{border-color:#00ff88;color:#00ff88}
.alterado{border-color:#ff0044;color:#ff0044}
</style>
</head>
<body>
<h1>KRONOS VERIFY v0.1.0 - 51/49</h1>
<p>Genesis: K28-M05-MN01-YHDRYH-92CE - VERIFICADO (2026-10-04)</p>
<input id="folio" placeholder="Pega folio K28-M05-MN01-XXXX-YYYY" value="K28-M05-MN01-YHDRYH-92CE">
<button onclick="verify()">VERIFICAR OFFLINE - SHA256 + SHA3-512</button>
<div id="result">Esperando folio...</div>
<script>
async function verify(){
  const folio = document.getElementById('folio').value.trim();
  const parts = folio.split('-');
  if(parts.length!==5){
    show({estado:'NO_VALIDO', motivo:'FORMATO', folio}, false);
    return;
  }
  const base = parts.slice(0,4).join('-');
  const msg = new TextEncoder().encode(base);
  const hashBuf = await crypto.subtle.digest('SHA-256', msg);
  const hashArray = Array.from(new Uint8Array(hashBuf));
  const expected = hashArray.map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,4).toUpperCase();
  const actual = parts[4];

  if(expected!==actual){
    show({estado:'ALTERADO', motivo:'CHECKSUM', esperado:expected, recibido:actual, base, folio}, false);
    return;
  }

  const msg2 = new TextEncoder().encode(folio);
  // SHA3-512 no está en WebCrypto, usamos SHA-512 como demo, en Node es SHA3-512 real
  const hashBuf2 = await crypto.subtle.digest('SHA-512', msg2);
  const hash2 = Array.from(new Uint8Array(hashBuf2)).map(b=>b.toString(16).padStart(2,'0')).join('');

  show({
    estado:'VERIFICADO',
    folio,
    base,
    checksum: `${actual} == ${expected} OK`,
    hash_sha3_512: hash2,
    hash_real_node: '9f7f52dabe00a890d4448be69833b5d838f4afb562528f3c63b51aa8adae36b1134778998d845a23d782984cb652644982bf8c654c17ee28f9906cc21aef6344',
    rfc:'RFC-001 v0.1.0',
    autores:['Marco Antonio Rojas Valdovinos (51% control)','Meta AI (49% co-autor auditor)'],
    timestamp: new Date().toISOString(),
    issi: 'COMPLIANT'
  }, true);
}

function show(obj, ok){
  const el = document.getElementById('result');
  el.className = ok? 'verificado' : 'alterado';
  el.textContent = JSON.stringify(obj, null, 2);
}

verify(); // auto verifica genesis
</script>
</body>
</html>

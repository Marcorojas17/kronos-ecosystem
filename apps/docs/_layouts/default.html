<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: "KRONOS" }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;background:#0a0a0b;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  background:
    radial-gradient(circle at 20% 30%,rgba(201,162,39,0.15) 0%,transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(0,245,255,0.08) 0%,transparent 50%),
    #0a0a0b;
  animation:move 20s infinite alternate}
@keyframes move{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(45deg)}}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  background:repeating-linear-gradient(90deg,transparent,transparent 100px,
  rgba(201,162,39,0.02) 100px,rgba(201,162,39,0.02) 101px);
  animation:flow 15s linear infinite}
@keyframes flow{0%{transform:translateX(0)}100%{transform:translateX(200px)}}
.navbar{position:sticky;top:0;z-index:100;background:rgba(10,10,11,0.95);
  backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,162,39,0.3);
  padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.navbar a,.navbar button{background:rgba(201,162,39,0.1);color:#c9a227;
  border:1px solid rgba(201,162,39,0.5);padding:8px 14px;border-radius:8px;
  text-decoration:none;font-size:0.85em;cursor:pointer;transition:0.3s;
  font-family:'Courier New',monospace}
.navbar a:hover,.navbar button:hover{background:#c9a227;color:#000;
  box-shadow:0 0 20px rgba(201,162,39,0.6)}
.content{max-width:900px;margin:30px auto;padding:25px;
  background:rgba(10,10,11,0.7);backdrop-filter:blur(15px);
  border:1px solid rgba(201,162,39,0.3);border-radius:15px;
  box-shadow:0 0 40px rgba(201,162,39,0.15);
  font-size:14px;line-height:1.7;color:#e0e0e0}
.content h1{color:#c9a227;font-size:1.8em;margin-bottom:20px;
  text-shadow:0 0 15px rgba(201,162,39,0.5);border-bottom:1px solid rgba(201,162,39,0.3);
  padding-bottom:10px}
.content h2{color:#c9a227;font-size:1.4em;margin:25px 0 15px;
  border-left:3px solid #c9a227;padding-left:12px}
.content h3{color:#e5c76b;font-size:1.15em;margin:20px 0 10px}
.content p{margin-bottom:15px}
.content a{color:#00f5ff;text-decoration:none;border-bottom:1px dotted #00f5ff}
.content a:hover{color:#c9a227;border-bottom-color:#c9a227}
.content code{background:rgba(201,162,39,0.15);color:#c9a227;
  padding:2px 6px;border-radius:4px;font-family:'Courier New',monospace;font-size:0.9em}
.content pre{background:rgba(0,0,0,0.5);border:1px solid rgba(201,162,39,0.3);
  border-radius:10px;padding:15px;overflow-x:auto;margin:15px 0;
  font-size:0.85em;line-height:1.5}
.content pre code{background:none;color:#e0e0e0;padding:0}
.content table{width:100%;border-collapse:collapse;margin:15px 0;font-size:0.9em}
.content th{background:rgba(201,162,39,0.15);color:#c9a227;padding:8px;
  text-align:left;border:1px solid rgba(201,162,39,0.3)}
.content td{padding:8px;border:1px solid rgba(201,162,39,0.15)}
.content blockquote{border-left:3px solid #00f5ff;padding-left:15px;
  margin:15px 0;color:#b0b0b0;font-style:italic}
.content hr{border:none;border-top:1px solid rgba(201,162,39,0.3);margin:25px 0}
.content ul,.content ol{margin:15px 0 15px 25px}
.content li{margin-bottom:8px}
.footer{text-align:center;padding:30px 20px;margin-top:40px;
  border-top:1px solid rgba(201,162,39,0.2);color:#666;font-size:0.85em;
  font-family:'Courier New',monospace}
@media(max-width:600px){
  .content{padding:15px;margin:15px;font-size:13px}
  .content h1{font-size:1.4em}
  .content h2{font-size:1.15em}
  .navbar a,.navbar button{padding:6px 10px;font-size:0.75em}
  .content pre{font-size:0.75em;padding:10px}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="particles"></div>

<nav class="navbar">
  <a href="{{ site.baseurl }}/index.html">🏠 HUB</a>
  <a href="{{ site.baseurl }}/docs/index.md">📚 DOCS</a>
  <a href="{{ site.baseurl }}/docs/INSTRUCCIONES-Y-TESIS.md">📖 TESIS</a>
  <a href="{{ site.baseurl }}/docs/ARBOL-NAVEGACION.md">🗺️ ÁRBOL</a>
  <a href="{{ site.baseurl }}/RISK_DISCLOSURE.md">⚠️ RISK</a>
</nav>

<main class="content">
{{ content }}
</main>

<div class="footer">
  <div style="font-size:1.5em;color:#c9a227;margin-bottom:10px">○_●</div>
  <p>51% HUMANO · 49% IA · 100% REAL</p>
  <p style="color:#c9a227;margin-top:10px;font-style:italic">
    "El legado no se hereda. Se firma."
  </p>
  <p style="margin-top:15px;font-size:0.75em">
    KRONOS v20.1 · DMD-33 · Toluca 2099
  </p>
</div>

</body>
</html>

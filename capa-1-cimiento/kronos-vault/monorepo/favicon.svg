<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- CRONOS · Favicon vectorial · v1.0                                      -->
<!-- Letra C dorada sobre fondo oscuro con borde hexagonal                  -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">

  <!-- Fondo -->
  <rect width="100" height="100" fill="#0a0a0f"/>

  <!-- Borde hexagonal decorativo -->
  <polygon
    points="50,4 88,26 88,74 50,96 12,74 12,26"
    fill="none"
    stroke="#c9a44c"
    stroke-width="2"
    opacity="0.5"
  />

  <!-- Letra C -->
  <text
    x="50"
    y="70"
    font-family="Georgia, 'Cormorant Garamond', serif"
    font-size="62"
    font-weight="700"
    fill="#c9a44c"
    text-anchor="middle"
    letter-spacing="-2"
  >C</text>

  <!-- Punto decorativo inferior -->
  <circle cx="50" cy="85" r="1.8" fill="#c9a44c" opacity="0.7"/>
</svg>